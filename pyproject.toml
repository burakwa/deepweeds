[project]
name = "deepweeds"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Burak K.", email = "burakkilnnc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.2",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.66.1",
    "timm>=1.0.30",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.66.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
deepweeds = "deepweeds:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
